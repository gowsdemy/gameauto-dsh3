name: 'GameMale Auto Sign-in v2 (Turnstile)'

on:
  schedule:
    - cron: '17 16 * * *' # 每天北京时间 00:17 自动运行
    - cron: '43 6 * * *'  # 每天北京时间 14:43 自动运行

  workflow_dispatch: # 必须保留：允许手动触发测试

jobs:
  signin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests ddddocr playwright
          python -m playwright install --with-deps chromium

      - name: Run Task Script
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # 可选：住宅代理（方案 A）。三种形式任选（都填时 PROXY_URL 优先）
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
        run: python gamemale_v2.py

      - name: Commit Asset Record
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f gold_record.txt ]; then
            git add gold_record.txt
            git commit -m "chore: 自动更新每日金币对比基准文件" || echo "今天金币没有任何变化，跳过本次保存"
            git push
          fi
