name: 'Probe Cloudflare Strong Stealth'

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright playwright-stealth
          pip install patchright
          python -m patchright install chromium
          python -m playwright install chromium

      - name: Run Probe HEADLESS
        run: python probe3.py
        env:
          MODE: headless

      - name: Run Probe HEADED (xvfb)
        run: xvfb-run -a python probe3.py
        env:
          MODE: headed

      - name: Upload inspection artifacts
        uses: actions/upload-artifact@v4
        with:
          name: challenge-html
          path: |
            *.html
            challenge_home.html
